[package]
name = "gooddealer-desktop-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
afternic-controlled-acceptance = ["gooddealer-local-storage/afternic-controlled-acceptance"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
base64 = "=0.22.1"
gooddealer-local-storage = { path = "../../../crates/local-storage" }
gooddealer-secure-host-core = { path = "../../../crates/secure-host-core" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["form", "native-tls"] }
tauri-plugin-opener = "=2.5.5"
tauri-plugin-single-instance = "=2.4.4"
tokio = { version = "=1.54.1", default-features = false, features = ["io-util", "macros", "net", "sync", "time"] }
url.workspace = true
zeroize = "=1.9.0"

[lints]
workspace = true
