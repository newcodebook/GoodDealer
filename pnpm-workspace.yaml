packages:
  - apps/*
  - packages/*
  - packages/connectors/*

allowBuilds:
  esbuild: true
  workerd: true

overrides:
  nanoid@<3.3.18: 3.3.18

# Temporary exception: thread-stream 4.2.0 (via fastify -> pino) types its transfer list with
# `worker_threads.TransferListItem`, which @types/node 26 removed; the patch swaps in `Transferable`.
# Remove this patch once a thread-stream release compiles against the current @types/node.
patchedDependencies:
  thread-stream@4.2.0: patches/thread-stream@4.2.0.patch

# Temporary exception: GHSA-fc5q-39xc-vjpf (picomatch <=4.0.7 extglob ReDoS) has no patched release.
# Every path reaches picomatch only through build and test tooling (vite, vitest, tinyglobby, astro's
# static build), which matches repository-authored globs, never untrusted input; no shipped Cloud,
# Account Web, Desktop, or static marketing output contains it. Remove this entry as soon as a
# patched picomatch is published and resolved.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
