[package]
name = "gooddealer-local-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []

[dependencies]
base64 = "=0.22.1"
chacha20poly1305.workspace = true
fs2 = "=0.4.3"
getrandom = "=0.4.3"
ring = "=0.17.14"
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "process", "std"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.11.0"
tempfile = "=3.27.0"
zeroize = "=1.9.0"

[dev-dependencies]
chacha20poly1305.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.11.0"
tempfile = "=3.27.0"

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", default-features = false, features = ["OSX_10_15"] }

[[example]]
name = "backup_evidence"
path = "examples/backup_evidence.rs"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"] }
