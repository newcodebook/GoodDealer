[package]
name = "gooddealer-secure-host-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
chacha20poly1305.workspace = true
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
getrandom = "=0.4.3"
hmac.workspace = true
reqwest = { version = "=0.13.4", default-features = false, features = ["native-tls", "stream"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt", "time"] }
url.workspace = true
zeroize = "=1.8.2"

[dev-dependencies]
rcgen = { version = "=0.14.5", default-features = false, features = ["crypto", "pem", "ring"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "warn"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Security_Credentials"], default-features = false }
