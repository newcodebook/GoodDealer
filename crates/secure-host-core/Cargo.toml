[package]
name = "gooddealer-secure-host-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "=0.22.1"
chacha20poly1305.workspace = true
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
getrandom = "=0.4.3"
hmac.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "stream"] }
ring = "=0.17.14"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
tokio = { version = "=1.54.1", default-features = false, features = ["io-util", "macros", "net", "rt", "time"] }
url.workspace = true
zeroize = "=1.9.0"

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "=3.27.0"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "warn"

[target.'cfg(target_os = "macos")'.dependencies]
fs2 = "=0.4.3"
libc = "=0.2.189"
rustix = { version = "=1.1.4", default-features = false, features = ["process", "std"] }
security-framework = { version = "=3.7.0", default-features = false, features = ["OSX_10_15"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security_Credentials"], default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"] }
