name: wp2-workspace-sync-persistence

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  postgres-workspace-sync-persistence:
    name: wp2-workspace-sync-persistence-postgresql-18.6
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      PGPASSWORD: postgres
      GOODDEALER_POSTGRES_OWNER_URL: postgresql://gooddealer_cloud_owner:owner-test-only@localhost:5432/postgres
      GOODDEALER_POSTGRES_APP_URL: postgresql://gooddealer_cloud_app:app-test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.18.0
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Create non-privileged owner and application roles
        run: |
          psql --host localhost --username postgres --dbname postgres --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE gooddealer_cloud_owner LOGIN PASSWORD 'owner-test-only' NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE gooddealer_cloud_app LOGIN PASSWORD 'app-test-only' NOSUPERUSER NOBYPASSRLS;
          ALTER DATABASE postgres OWNER TO gooddealer_cloud_owner;
          SQL
      - name: Verify fail-closed evidence policy
        run: node --test scripts/workspace-sync-persistence-evidence-policy.test.mjs
      - name: Collect exact PostgreSQL workspace sync persistence evidence
        run: |
          mkdir -p .artifacts/wp2/workspace-sync-persistence
          set -o pipefail
          node scripts/collect-workspace-sync-persistence-report.mjs 2>&1 | tee .artifacts/wp2/workspace-sync-persistence/collector.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: wp2-workspace-sync-persistence-${{ github.run_id }}-${{ github.run_attempt }}-evidence
          path: .artifacts/wp2/workspace-sync-persistence
          include-hidden-files: true
          retention-days: 90
