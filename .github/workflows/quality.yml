name: quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

env:
  CI: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WP0_CI_JOB_NAME: quality
      WP0_EXPECTED_PLATFORM: linux
      WP0_EXPECTED_ARCH: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Initialize WP-0 evidence
        env:
          WP0_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect-wp0-evidence.mjs --profile quality --prepare
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.18.0
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Remove partial pinned Rust toolchain from runner image
        continue-on-error: true
        run: rustup toolchain uninstall 1.97.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy --force
      - name: Restore pinned Rust dependency auditor
        id: cargo-audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2-rust-1.97.1
      - name: Install pinned Rust dependency auditor
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Run quality gates and collect WP-0 evidence
        env:
          WP0_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect-wp0-evidence.mjs --profile quality
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: wp0-quality-${{ github.run_id }}-${{ github.run_attempt }}-evidence
          path: .artifacts/wp0
          include-hidden-files: true
          retention-days: 90
