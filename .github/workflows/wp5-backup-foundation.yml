name: wp5-backup-foundation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  backup-foundation:
    name: wp5-backup-foundation-postgresql-18.6
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      PGPASSWORD: postgres
      GOODDEALER_POSTGRES_OWNER_URL: postgresql://gooddealer_cloud_owner:owner-test-only@localhost:5432/postgres
      GOODDEALER_POSTGRES_APP_URL: postgresql://gooddealer_cloud_app:app-test-only@localhost:5432/postgres
      GOODDEALER_POSTGRES_ACCOUNT_API_URL: postgresql://gd_account_api:account-api-test-only@localhost:5432/postgres
      GOODDEALER_POSTGRES_IDENTITY_ISSUER_URL: postgresql://gd_identity_capability_issuer:identity-issuer-test-only@localhost:5432/postgres
      GOODDEALER_POSTGRES_PROVIDER_INGRESS_URL: postgresql://gd_provider_ingress:provider-ingress-test-only@localhost:5432/postgres
      GOODDEALER_POSTGRES_PROVIDER_WORKER_URL: postgresql://gd_provider_worker:provider-worker-test-only@localhost:5432/postgres
      GOODDEALER_UNQUALIFIED_POSTGRES_DIAGNOSTIC: "false"
      EVIDENCE_PROFILE: local
      EVIDENCE_CI_JOB_NAME: wp5-backup-foundation-postgresql-18.6
      EVIDENCE_EXPECTED_PLATFORM: linux
      EVIDENCE_EXPECTED_ARCH: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
          rustup default 1.99.1
      - run: npm install --global pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - name: Create non-privileged roles
        run: |
          psql --host localhost --username postgres --dbname postgres --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE gooddealer_cloud_owner LOGIN PASSWORD 'owner-test-only' NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE gooddealer_cloud_app LOGIN PASSWORD 'app-test-only' NOSUPERUSER NOBYPASSRLS;
          ALTER DATABASE postgres OWNER TO gooddealer_cloud_owner;
          SQL
      - name: Provision capability roles
        run: |
          psql --host localhost --username postgres --dbname postgres --set ON_ERROR_STOP=1 \
            --file apps/cloud/scripts/provision-identity-capability-roles.sql
          psql --host localhost --username postgres --dbname postgres --set ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE gd_identity_capability_issuer PASSWORD 'identity-issuer-test-only';
          ALTER ROLE gd_account_api PASSWORD 'account-api-test-only';
          ALTER ROLE gd_provider_ingress PASSWORD 'provider-ingress-test-only';
          ALTER ROLE gd_provider_worker PASSWORD 'provider-worker-test-only';
          SQL
      - name: Verify fail-closed evidence policies
        run: node --test scripts/backup-evidence-policy.test.mjs scripts/recovery-persistence-evidence-policy.test.mjs
      - name: Collect repository-only unavailable backup evidence
        env:
          EVIDENCE_GITHUB_TOKEN: ${{ github.token }}
        run: pnpm evidence:wp5:backup
      - name: Collect qualifying recovery persistence evidence (exact PostgreSQL 18.6)
        run: pnpm evidence:wp5:recovery-persistence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wp5-backup-foundation-${{ github.run_id }}-${{ github.run_attempt }}-evidence
          path: .artifacts/wp5
          include-hidden-files: true
          retention-days: 90
