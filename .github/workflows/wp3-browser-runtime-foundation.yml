name: wp3-browser-runtime-foundation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  portable:
    name: wp3-browser-runtime-foundation-portable-ubuntu-24.04-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Collect non-closing Portable browser runtime evidence
        run: node scripts/collect-browser-runtime-foundation-report.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wp3-browser-runtime-foundation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/wp3/browser-runtime-foundation
          include-hidden-files: true
          retention-days: 90
