name: marketing-web

# Build-check PRs and manual dispatches; deploy only a verified main-push checkout.
# The workflow never provisions Pages resources: the fixed upload command fails visibly
# when its external prerequisites are absent, unauthorized, or misconfigured.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/marketing-web/**
      - packages/ui/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .node-version
      - .github/workflows/marketing-web.yml
      - scripts/marketing-web-workflow-policy.test.mjs
  push:
    branches: [main]
    paths:
      - apps/marketing-web/**
      - packages/ui/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .node-version
      - .github/workflows/marketing-web.yml
      - scripts/marketing-web-workflow-policy.test.mjs

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true

jobs:
  check:
    name: Build & check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.18.0
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify marketing deployment source policy
        run: node --test scripts/marketing-web-workflow-policy.test.mjs
      - name: Typecheck @gooddealer/marketing-web
        run: pnpm --filter @gooddealer/marketing-web typecheck
      - name: Build @gooddealer/marketing-web
        run: pnpm --filter @gooddealer/marketing-web build

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: check
    # Manual dispatch and PRs are check-only. Promotion requires this main-push event.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.18.0
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Build @gooddealer/marketing-web
        run: pnpm --filter @gooddealer/marketing-web build
      - name: Deploy to Cloudflare Pages
        working-directory: apps/marketing-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy dist --project-name gooddealer-marketing --branch main
