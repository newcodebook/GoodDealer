name: native

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

env:
  CI: true

jobs:
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-server-2025-x64-compile
            os: windows-2025
            platform: win32
            arch: x64
          - name: macos-15-arm64
            os: macos-15
            platform: darwin
            arch: arm64
          - name: macos-15-intel
            os: macos-15-intel
            platform: darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      WP0_CI_JOB_NAME: ${{ matrix.name }}
      WP0_EXPECTED_PLATFORM: ${{ matrix.platform }}
      WP0_EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Initialize WP-0 evidence
        env:
          WP0_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect-wp0-evidence.mjs --profile native --prepare
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.18.0
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Run native gates and collect WP-0 evidence
        env:
          WP0_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect-wp0-evidence.mjs --profile native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: wp0-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}-evidence
          path: .artifacts/wp0
          include-hidden-files: true
          retention-days: 90
