name: wp4-cloud-boundary

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

env:
  CI: true

jobs:
  cloud-boundary:
    name: wp4-cloud-boundary-ubuntu-24.04-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EVIDENCE_CI_JOB_NAME: wp4-cloud-boundary-ubuntu-24.04-x64
      EVIDENCE_EXPECTED_PLATFORM: linux
      EVIDENCE_EXPECTED_ARCH: x64
      EVIDENCE_OWNER_ROLE: Cloud Platform Lead
      EVIDENCE_OWNING_MODULES: cloud-entrypoints-public,cloud-entrypoints-admin,cloud-entrypoints-jobs,protocol-wire
      EVIDENCE_REQUIRED_REVIEWER_ROLE: Security Reviewer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Initialize WP-4 Cloud boundary evidence
        env:
          EVIDENCE_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect-wp0-evidence.mjs --profile quality --slice cloud-boundary --prepare
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.18.0
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Cloud boundary evidence
        env:
          EVIDENCE_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect-wp0-evidence.mjs --profile quality --slice cloud-boundary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: wp4-cloud-boundary-${{ github.run_id }}-${{ github.run_attempt }}-evidence
          path: .artifacts/wp4/cloud-boundary
          include-hidden-files: true
          retention-days: 90
