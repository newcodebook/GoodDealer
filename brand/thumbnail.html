<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<title>GoodDealer</title>
<link rel="stylesheet" href="styles.css">
<style>
html,body{margin:0}
.tile{width:1280px;height:854px;display:flex;overflow:hidden;background:#0A0B0F;font-family:"General Sans","Noto Sans SC",-apple-system,"Segoe UI",sans-serif}
.main{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#0A0B0F}
.main::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 42%,rgba(212,164,55,0.10),transparent 62%)}
.mark{position:relative;width:404px;height:404px}
.strip{width:236px;flex:none;display:flex;flex-direction:column}
.strip span{flex:1}
</style></head>
<body><div class="tile">
<div class="main"><img class="mark" src="assets/logo/mark.svg" alt="GoodDealer"></div>
<div class="strip">
<span style="background:#D4A437"></span>
<span style="background:#E5735F"></span>
<span style="background:#5CAE7D"></span>
<span style="background:#4D8DFF"></span>
</div>
</div></body></html>
