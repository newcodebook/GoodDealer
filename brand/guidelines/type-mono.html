<!-- @dsCard group="Type" viewport="700x190" name="Mono · Numbers" subtitle="JetBrains Mono：估值、代码、状态徽章——tabular-nums 强制对齐" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 24px;display:flex;gap:32px;align-items:center}
.col{display:flex;flex-direction:column;gap:2px}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:15px;text-align:right}
.lbl{font-size:11px;color:var(--text-faint);margin-bottom:6px}</style></head>
<body>
<div class="col"><span class="lbl">右对齐 · 小数位对齐</span>
<span class="num" style="color:var(--gd-gold)">12,800.00</span>
<span class="num" style="color:var(--gd-gold)">1,499.00</span>
<span class="num" style="color:var(--gd-gold)">388.88</span>
<span class="num" style="color:var(--text-muted)">—</span></div>
<div class="col"><span class="lbl">十进制定点 + ISO 4217，禁浮点</span>
<span class="num">USD 12,800.00</span>
<span class="num">CNY 92,414.40</span>
<span class="num" style="color:var(--gd-success)">+6.2%</span>
<span class="num" style="color:var(--gd-danger)">−1.8%</span></div>
<div class="col"><span class="lbl">代码 / 术语</span>
<code style="font-size:12px;color:var(--text-body)">lease_epoch: 41</code>
<code style="font-size:12px;color:var(--text-body)">failed_retryable</code>
<code style="font-size:12px;color:var(--gd-blue)">SYNCED · rev 8,241</code></div>
</body></html>
