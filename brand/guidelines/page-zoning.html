<!-- @dsCard group="Foundations" viewport="700x300" name="Page Zoning" subtitle="页面信息分区：6 个固定带 + 深度轴 摘要→分组→明细；每页仅一个主焦点" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 20px;display:flex;gap:20px;align-items:center}
.win{flex:1.3;border:1px solid var(--gd-line-strong);border-radius:var(--radius-md);overflow:hidden;display:flex;flex-direction:column;height:250px}
.z{padding:0 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--gd-line);font-size:11px;color:var(--text-2)}
.z b{color:var(--text-1);font-weight:500}
.tag{margin-left:auto;font-family:var(--font-mono);font-size:9px;color:var(--text-3)}
.legend{flex:1;display:flex;flex-direction:column;gap:9px}
.li{font-size:12px;color:var(--text-2)}.li b{color:var(--text-1);font-weight:500}
.li .g{font-family:var(--font-mono);font-size:9px;color:var(--text-3);display:block}</style></head>
<body>
<div class="win">
<div class="z" style="height:26px;background:var(--surface-chrome)"><b>① 标识</b> 标题栏<span class="tag">ambient</span></div>
<div class="z" style="height:34px;background:var(--surface-app)"><b>② 导航</b> 工具栏 · ⌘K<span class="tag">E2</span></div>
<div class="z" style="height:44px;background:var(--surface-card)"><b>③ 概览</b> 指标 Ribbon<span class="tag">次焦点</span></div>
<div class="z" style="flex:1;background:var(--surface-app);border-bottom:none;color:var(--text-1)"><b style="color:var(--gd-gold)">④ 工作面</b> 数据表 · 主焦点<span class="tag" style="color:var(--gd-gold)">E1 · 最大视觉权重</span></div>
<div class="z" style="height:26px;background:var(--surface-chrome);border-bottom:none"><b>⑥ 状态</b> 状态栏<span class="tag">ambient</span></div>
</div>
<div class="legend">
<div class="li"><b>焦点法则</b> 每页恰好一个主焦点（④ 工作面）；概览为次，壳层为环境。<span class="g">attention: 工作面 &gt; 概览 &gt; 导航 &gt; 状态</span></div>
<div class="li"><b>⑤ 动作层</b> 批量/上下文动作按需浮现于工作面（BatchBar），不常驻。</div>
<div class="li"><b>深度轴</b> 面对万行数据不直接展开：<br>摘要层 → 分组层 → 明细层（虚拟滚动）。<span class="g">summary → group → detail</span></div>
</div>
</body></html>
