<!-- @dsCard group="Foundations" viewport="700x230" name="Emphasis Ladder" subtitle="注意力 4 档 E1→E4（响→静）：颜色+权重编码「多少注意力」；每视图仅一个 E1" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;align-items:stretch}
.card{flex:1;border:1px solid var(--gd-line);border-radius:var(--radius-md);background:var(--gd-panel);padding:12px;display:flex;flex-direction:column;gap:9px}
.btn{height:28px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;font-family:var(--font-sans)}
.lv{font-family:var(--font-mono);font-size:10px;color:var(--text-3)}
.note{font-size:11px;color:var(--text-2);display:flex;gap:18px;flex-wrap:wrap}
.chip{width:9px;height:9px;border-radius:2px;display:inline-block;vertical-align:middle;margin-right:5px}</style></head>
<body>
<div class="row">
<div class="card"><span class="btn" style="background:var(--gd-blue);color:#fff">批准执行</span><span class="lv">E1 主 · 实心蓝 · 焦点，每视图一个</span></div>
<div class="card"><span class="btn" style="background:var(--gd-panel-raised);border:1px solid var(--gd-line-strong);color:var(--text-1)">导出预览</span><span class="lv">E2 次 · 描边/提亮</span></div>
<div class="card"><span class="btn" style="background:transparent;color:var(--text-2)">取消</span><span class="lv">E3 三 · Ghost</span></div>
<div class="card"><span class="btn" style="background:transparent;color:var(--gd-blue)">查看详情 ›</span><span class="lv">E4 静 · 纯文本/链接</span></div>
</div>
<div class="note">
<span><span class="chip" style="background:var(--gd-gold)"></span>金 = 价值/所有权（唯一含义）</span>
<span><span class="chip" style="background:var(--gd-blue)"></span>蓝 = 交互/同步（唯一含义）</span>
<span><span class="chip" style="background:var(--gd-danger)"></span>状态色 = 语义，不作装饰</span>
<span><span class="chip" style="background:var(--gd-line-strong)"></span>灰阶 = 结构，无语义</span>
</div>
</body></html>
