<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;display:flex;flex-direction:column;gap:12px;justify-content:center}

.seg{display:flex;align-items:center;padding:0 12px;font-family:var(--font-mono);font-size:11px}
.rules{display:flex;gap:16px;font-size:11px;color:var(--text-muted)}
.rules b{color:var(--gd-danger);font-weight:500}</style></head>
<body>
<div class="bar">
<div class="seg" style="width:70%;background:var(--gd-ink);color:var(--text-muted)">70% 墨黑 · 背景与结构</div>
<div class="seg" style="width:20%;background:var(--gd-gold);color:#0A0B0F">20% 金</div>
<div class="seg" style="width:10%;background:var(--gd-blue);color:#fff">10%</div>
</div>
<div class="rules"><span><b>禁</b> 高饱和纯金 #FFD700</span><span><b>禁</b> 金蓝混合渐变</span><span><b>禁</b> 蓝色渐变/辉光</span><span><b>禁</b> 金大面积填充</span></div>
</body></html>
