<!-- @dsCard group="Foundations" viewport="700x150" name="Radii & Borders" subtitle="小而克制的原生桌面圆角；1px 描线" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 24px;display:flex;gap:14px;align-items:center}
.c{border:1px solid var(--gd-line-strong);background:var(--gd-panel);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;height:96px;flex:1}
.n{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.u{font-size:11px;color:var(--text-faint)}</style></head>
<body>
<div class="c" style="border-radius:var(--radius-xs)"><span class="n">3px</span><span class="u">勾选框 · 标签</span></div>
<div class="c" style="border-radius:var(--radius-sm)"><span class="n">5px</span><span class="u">按钮 · 输入</span></div>
<div class="c" style="border-radius:var(--radius-md)"><span class="n">7px</span><span class="u">卡片 · 面板</span></div>
<div class="c" style="border-radius:var(--radius-lg)"><span class="n">10px</span><span class="u">对话框 · 命令面板</span></div>
<div class="c" style="border-radius:var(--radius-full);flex:.7;height:44px;align-self:center"><span class="n">999</span></div>
</body></html>
