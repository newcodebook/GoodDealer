<!-- @dsCard group="Colors" viewport="700x150" name="Ink · 70%" subtitle="舞台：墨黑带蓝偏，禁纯黑" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{display:flex;gap:8px;padding:16px}
.sw{flex:1;border-radius:var(--radius-md);border:1px solid var(--gd-line);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:118px}
.n{font-size:11px;color:var(--text-muted)}.v{font-family:var(--font-mono);font-size:11px;color:var(--text-body)}</style></head>
<body>
<div class="sw" style="background:var(--gd-ink)"><span class="n">墨黑 ink</span><span class="v">#0A0B0F</span></div>
<div class="sw" style="background:var(--gd-panel)"><span class="n">面板 panel</span><span class="v">#10131A</span></div>
<div class="sw" style="background:var(--gd-panel-raised)"><span class="n">提亮 raised</span><span class="v">#14171F</span></div>
<div class="sw" style="background:var(--gd-line)"><span class="n">描线 line</span><span class="v">#1E2230</span></div>
<div class="sw" style="background:var(--gd-line-strong)"><span class="n">强描线</span><span class="v">#2A3040</span></div>
</body></html>
