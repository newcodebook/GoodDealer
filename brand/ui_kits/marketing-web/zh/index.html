    <section id="platforms"><window.MKPlatforms/></section>
    <section id="demo"><window.MKShowcase/></section>
    <section id="security"><window.MKSecurity/></section>
    <section id="pricing"><window.MKPricing/></section>
    <section id="faq"><window.MKFaq/></section>
    <section id="download"><window.MKDownload/></section>
  </window.MKShell>;
}
(function boot(){
  if(window.MKShell&&window.MKSeal&&window.MKHero&&window.MKBenefits&&window.MKPillars&&window.MKWorkflow&&window.MKShowcase&&window.MKPlatforms&&window.MKSecurity&&window.MKPricing&&window.MKFaq&&window.MKDownload&&window.MK_DATA){
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
    reveal();
  }else{setTimeout(boot,20);}
})();
function reveal(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("mk-in");io.unobserve(e.target);}});},{threshold:0.12,rootMargin:"0px 0px -8% 0px"});
  (function arm(){var secs=document.querySelectorAll("#root main > section");if(!secs.length){return void setTimeout(arm,40);}
    secs.forEach(function(s){s.classList.add("js-reveal");io.observe(s);});})();
}
