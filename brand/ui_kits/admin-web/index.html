<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>GoodDealer · 运营控制台</title>
<link rel="icon" href="../../assets/logo/mark-16.svg">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
<style>html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--gd-ink);background-image:radial-gradient(120% 90% at 100% 0%,rgba(77,141,255,0.04),transparent 55%)}
#root{height:100vh;overflow:hidden}
@keyframes gd-spinner{to{transform:rotate(360deg)}}</style>
</head>
<body><div id="root"></div>
<script type="text/babel" src="./icons.jsx"></script>
<script type="text/babel" src="./controls.jsx"></script>
<script type="text/babel" src="./AdminShell.jsx"></script>
<script type="text/babel" src="./AdminDashboard.jsx"></script>
<script type="text/babel" src="./Customers.jsx"></script>
<script type="text/babel" src="./Licenses.jsx"></script>
<script type="text/babel" src="./Fleet.jsx"></script>
<script type="text/babel" src="./Revenue.jsx"></script>
<script type="text/babel" src="./SyncInfra.jsx"></script>
<script type="text/babel" src="./Support.jsx"></script>
<script type="text/babel" src="./Audit.jsx"></script>
<script type="text/babel" src="./Config.jsx"></script>
<script type="text/babel" src="./Announcements.jsx"></script>
<script type="text/babel">
const TITLES={dashboard:"运营概览",customers:"客户管理",licenses:"许可与订阅",revenue:"计费与营收",fleet:"设备舰队",infra:"同步与基础设施",audit:"审计日志",support:"支持工单",announcements:"公告",config:"系统配置"};
function App(){
  const [screen,setScreen]=React.useState("dashboard");
  const [syncing,setSyncing]=React.useState(false);
  const go=k=>setScreen(k);
  const sync=()=>{setSyncing(true);setTimeout(()=>setSyncing(false),1200);};
  const body=screen==="dashboard"?<GDAdminDashboard go={go}/>
    :screen==="customers"?<GDCustomers/>
    :screen==="licenses"?<GDLicenses/>
    :screen==="revenue"?<GDRevenue/>
    :screen==="fleet"?<GDFleet/>
    :screen==="infra"?<GDSyncInfra/>
    :screen==="audit"?<GDAudit/>
    :screen==="support"?<GDSupport/>
    :screen==="announcements"?<GDAnnouncements/>
    :<GDConfig/>;
  return <GDAdminShell active={screen} onGo={go} title={TITLES[screen]} syncing={syncing} onSync={sync}>{body}</GDAdminShell>;
}
(function boot(){
  if(window.GDAdminShell&&window.GDAdminDashboard&&window.GDCustomers&&window.GDLicenses&&window.GDFleet&&window.GDRevenue&&window.GDSyncInfra&&window.GDSupport&&window.GDAudit&&window.GDConfig&&window.GDAnnouncements&&window.GDMetricStrip&&window.GDPagination&&window.GDI){
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  }else{setTimeout(boot,20);}
})();
</script></body></html>
