<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>GoodDealer · 云端账户</title>
<link rel="icon" href="../../assets/logo/mark-16.svg">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
<style>html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--gd-ink);background-image:radial-gradient(120% 90% at 100% 0%,rgba(212,164,55,0.045),transparent 55%)}
#root{height:100vh;overflow:hidden}
@keyframes gd-spinner{to{transform:rotate(360deg)}}</style>
</head>
<body><div id="root"></div>
<script type="text/babel" src="./icons.jsx"></script>
<script type="text/babel" src="./controls.jsx"></script>
<script type="text/babel" src="./AccountShell.jsx"></script>
<script type="text/babel" src="./AccountDashboard.jsx"></script>
<script type="text/babel" src="./License.jsx"></script>
<script type="text/babel" src="./Devices.jsx"></script>
<script type="text/babel" src="./Billing.jsx"></script>
<script type="text/babel" src="./Security.jsx"></script>
<script type="text/babel" src="./CloudData.jsx"></script>
<script type="text/babel" src="./AccountSettings.jsx"></script>
<script type="text/babel" src="./Download.jsx"></script>
<script type="text/babel">
const TITLES={dashboard:"概览",license:"订阅与许可",devices:"设备管理",billing:"账单与发票",security:"安全",cloud:"云端数据",settings:"账户设置",download:"下载客户端"};
function App(){
  const [screen,setScreen]=React.useState("dashboard");
  const [syncing,setSyncing]=React.useState(false);
  const go=k=>setScreen(k);
  const sync=()=>{setSyncing(true);setTimeout(()=>setSyncing(false),1200);};
  const body=screen==="dashboard"?<GDDashboard go={go}/>
    :screen==="license"?<GDLicense/>
    :screen==="devices"?<GDDevices/>
    :screen==="billing"?<GDBilling/>
    :screen==="security"?<GDSecurity/>
    :screen==="cloud"?<GDCloudData/>
    :screen==="settings"?<GDAccountSettings/>
    :<GDDownload/>;
  return <GDShell active={screen} onGo={go} title={TITLES[screen]} syncing={syncing} onSync={sync}>{body}</GDShell>;
}
(function boot(){
  if(window.GDShell&&window.GDDashboard&&window.GDLicense&&window.GDDevices&&window.GDBilling&&window.GDSecurity&&window.GDCloudData&&window.GDAccountSettings&&window.GDDownload&&window.GDMetricStrip&&window.GDPagination&&window.GDI){
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  }else{setTimeout(boot,20);}
})();
</script></body></html>
