<!-- @dsCard group="Account Web" viewport="1200x900" name="GoodDealer 账户网页端" subtitle="独立 Web 壳（响应式顶栏 + 账户区左导航）· 定价 · 结账（Paddle MoR）· 订阅与账单（升降级/取消/发票/续费恢复）。品牌一致的 web 形态，非原生桌面终端" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoodDealer · 账户</title>
<link rel="icon" href="../../assets/logo/mark-16.svg">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
<style>
html,body{height:100%}
body{margin:0;background:var(--gd-ink);color:var(--text-1);font-family:var(--font-sans);font-size:14px}
#root{min-height:100vh}
@keyframes gd-spinner{to{transform:rotate(360deg)}}
/* ——— account-web shell (its own web chrome; NOT the desktop WindowChrome) ——— */
.aw{min-height:100vh;display:flex;flex-direction:column}
.aw-top{position:sticky;top:0;z-index:20;height:56px;flex:none;display:flex;align-items:center;gap:16px;padding:0 24px;background:var(--gd-chrome);border-bottom:1px solid var(--gd-line)}
.aw-brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;letter-spacing:-0.01em;color:var(--text-1);text-decoration:none}
.aw-top-nav{margin-left:auto;display:flex;align-items:center;gap:18px;font-size:13px}
.aw-top-nav a,.aw-top-nav button{color:var(--text-2);background:none;border:none;cursor:pointer;font:inherit;text-decoration:none}
.aw-top-nav a:hover,.aw-top-nav button:hover{color:var(--text-1)}
.aw-body{flex:1;min-height:0;display:flex}
/* flow layout (pricing / checkout): centered column */
.aw-flow{flex:1;display:flex;justify-content:center;padding:40px 24px 64px}
.aw-flow-inner{width:100%;max-width:1040px}
/* account layout: left nav + main */
.aw-side{width:224px;flex:none;border-right:1px solid var(--gd-line);background:var(--gd-panel);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.aw-side-sec{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-3);padding:12px 10px 4px}
.aw-nav{display:flex;align-items:center;gap:9px;height:34px;padding:0 10px;border-radius:6px;font-size:13px;color:var(--text-2);cursor:pointer;border:none;background:none;text-align:left;width:100%;font-family:var(--font-sans)}
.aw-nav:hover{background:var(--gd-panel-raised);color:var(--text-1)}
.aw-nav--on{background:var(--gd-panel-raised);color:var(--text-1);font-weight:500}
.aw-nav--soon{opacity:.5;cursor:default}
.aw-main{flex:1;min-width:0;overflow:auto;padding:28px 32px 56px}
.aw-main-inner{max-width:820px;margin:0 auto}
.aw-h1{font-size:22px;font-weight:600;letter-spacing:-0.01em;margin:0 0 4px}
.aw-sub{font-size:13px;color:var(--text-2);margin:0 0 22px}
/* card */
.aw-card{border:1px solid var(--gd-line);background:var(--gd-panel);border-radius:9px;padding:18px 20px}
.aw-foot{border-top:1px solid var(--gd-line);padding:16px 24px;font-size:11px;color:var(--text-3);display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
@media (max-width:820px){
  .aw-top{padding:0 16px}
  .aw-body{flex-direction:column}
  .aw-side{width:auto;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--gd-line);padding:8px 12px;gap:6px}
  .aw-side-sec{display:none}
  .aw-nav{width:auto;flex:none;white-space:nowrap;height:32px}
  .aw-main{padding:20px 16px 40px}
  .aw-flow{padding:24px 16px 48px}
}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel" src="./AccountShell.jsx"></script>
<script type="text/babel" src="./Pricing.jsx"></script>
<script type="text/babel" src="./Checkout.jsx"></script>
<script type="text/babel" src="./Subscription.jsx"></script>
<script type="text/babel" src="./Devices.jsx"></script>
<script type="text/babel" src="./Security.jsx"></script>
<script type="text/babel" src="./DataPrivacy.jsx"></script>
<script type="text/babel" src="./Support.jsx"></script>
<script type="text/babel" src="./Auth.jsx"></script>
<script type="text/babel">
function App(){
  const [page,setPage]=React.useState("pricing"); // pricing | checkout | subscription
  const [plan,setPlan]=React.useState(null);
  const go=(p,extra)=>{if(extra&&extra.plan)setPlan(extra.plan);setPage(p);window.scrollTo(0,0);};
  const body=page==="signin"?<window.AWAuth onAuthed={()=>go("subscription")}/>
    :page==="pricing"?<window.AWPricing onChoose={p=>go("checkout",{plan:p})} onManage={()=>go("signin")}/>
    :page==="checkout"?<window.AWCheckout plan={plan} onBack={()=>go("pricing")} onDone={()=>go("subscription")}/>
    :page==="devices"?<window.AWDevices/>
    :page==="security"?<window.AWSecurity/>
    :page==="data"?<window.AWDataPrivacy/>
    :page==="support"?<window.AWSupport/>
    :<window.AWSubscription onChangePlan={()=>go("pricing")}/>;
  return <window.AWShell page={page} onGo={go}>{body}</window.AWShell>;
}
(function boot(){
  if(window.AWShell&&window.AWPricing&&window.AWCheckout&&window.AWSubscription&&window.AWDevices&&window.AWSecurity&&window.AWDataPrivacy&&window.AWSupport&&window.AWAuth&&window.AW_DATA){
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  }else{setTimeout(boot,20);}
})();
</script></body></html>
