<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>GoodDealer · 账户登录</title>
<link rel="icon" href="../../assets/logo/mark-16.svg">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{height:100%;overflow:hidden}
body{margin:0;background:#06070A;background-image:radial-gradient(120% 80% at 50% 0%,rgba(212,164,55,0.06),transparent 55%)}
#root{height:100vh;padding:20px;display:flex;align-items:center;justify-content:center}
@keyframes gd-spinner{to{transform:rotate(360deg)}}</style>
</head>
<body><div id="root"></div>
<script type="text/babel" src="./icons.jsx"></script>
<script type="text/babel" src="./Onboarding.jsx"></script>
<script type="text/babel" src="./SignIn.jsx"></script>
<script type="text/babel">
// Account gate → device gate, as one continuous path.
function AuthFlow(){
  const [authed,setAuthed]=React.useState(false);
  if(authed) return <window.GDOnboarding startIdx={1} onFinish={()=>setAuthed(false)} onSkip={()=>setAuthed(false)}/>;
  return <window.GDSignIn onAuthed={()=>setAuthed(true)}/>;
}
(function boot(){
  if(window.GDSignIn&&window.GDOnboarding&&window.GDI){
    ReactDOM.createRoot(document.getElementById("root")).render(<AuthFlow/>);
  }else{setTimeout(boot,20);}
})();
</script></body></html>
