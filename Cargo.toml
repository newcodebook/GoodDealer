[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/automation-host",
  "crates/local-storage",
  "crates/secure-host-core",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "Proprietary"

[workspace.dependencies]
chacha20poly1305 = "=0.11.0"
hmac = "=0.13.0"
rusqlite = { git = "https://github.com/rusqlite/rusqlite.git", rev = "62648175c23f84b45238f4a1fbb0133b75ce68f1", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.0"
tauri = "=2.12.5"
tauri-build = "=2.7.4"
url = "=2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Rust 1.99 lint whose rewrite, `assert_ne!(value, [] as [T; 0])`, needs `PartialEq` and `Debug` on
# domain types solely for tests and reads worse than `assert!(value.is_empty())`.
assert_is_empty = "allow"
