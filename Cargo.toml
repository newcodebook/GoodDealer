[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/automation-host",
  "crates/local-storage",
  "crates/secure-host-core",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "Proprietary"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = "=2.11.5"
tauri-build = "=2.6.3"
wry = "=0.55.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
