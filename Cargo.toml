[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/automation-host",
  "crates/local-storage",
  "crates/secure-host-core",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "Proprietary"

[workspace.dependencies]
chacha20poly1305 = "=0.11.0"
hmac = "=0.12.1"
rusqlite = { git = "https://github.com/rusqlite/rusqlite.git", rev = "62648175c23f84b45238f4a1fbb0133b75ce68f1", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = "=2.11.5"
tauri-build = "=2.6.3"
url = "=2.5.8"
wry = "=0.55.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
